name: API tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      # 1. Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Получаем всю историю для Allure history

      # 2. Установка Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Клонирование тестового сервера
      - name: Clone test server repository
        run: |
          git clone https://github.com/Nikita-Filonov/qa-automation-engineer-api-course.git

      # 4. Установка зависимостей сервера
      - name: Install server dependencies
        run: |
          cd qa-automation-engineer-api-course
          pip install -r requirements.txt

      # 5. Запуск и проверка сервера
      - name: Start and verify test server
        env:
          APP_HOST: "http://localhost:8000"
          DATABASE_URL: "sqlite+aiosqlite:///./local.db"
          JWT_ALGORITHM: "HS256"
          JWT_SECRET_KEY: "qa-automation-engineer-api-course-secret-key"
          JWT_ACCESS_TOKEN_EXPIRE: 1800
          JWT_REFRESH_TOKEN_EXPIRE: 5184000
        run: |
          cd qa-automation-engineer-api-course
          
          # Запуск сервера в фоне
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          
          # Ждем, пока сервер станет доступен
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/docs > /dev/null 2>&1; then
              echo "✅ Server is up and running!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Server failed to start within 30 seconds"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            echo "Attempt $i/30: Waiting for server..."
            sleep 1
          done
          
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

      # 6. Установка зависимостей проекта
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest pytest-xdist

      # 7. Запуск тестов
      - name: Run API tests
        run: |
          pytest -m regression \
            --alluredir=allure-results \
            --numprocesses=2 \
            --junitxml=test-results.xml \
            --tb=short \
            -v

      # 8. Завершение сервера
      - name: Stop test server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            echo "Stopping server with PID: $SERVER_PID"
            kill $SERVER_PID 2>/dev/null || true
          fi

      # 9. Установка Allure CLI
      - name: Install Allure CLI
        if: always()
        run: |
          # Установка Allure через npm (самый простой способ)
          sudo apt-get update
          sudo apt-get install -y default-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          sudo tar -zxvf allure-2.27.0.tgz -C /opt/
          sudo ln -s /opt/allure-2.27.0/bin/allure /usr/bin/allure
          allure --version

      # 10. Генерация Allure отчета
      - name: Generate Allure Report
        if: always()
        run: |
          # Создаем папку для отчетов
          mkdir -p allure-report
          
          # Генерируем отчет
          allure generate allure-results -o allure-report --clean
          
          # Создаем index.html для GitHub Pages
          echo "<!DOCTYPE html>
          <html>
          <head>
              <meta http-equiv='refresh' content='0; url=./allure-report/index.html' />
              <title>Allure Report</title>
          </head>
          <body>
              <p>Redirecting to <a href='./allure-report/index.html'>Allure Report</a>...</p>
          </body>
          </html>" > allure-report/index.html

      # 11. Деплой на GitHub Pages
      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          force_orphan: true
          keep_files: false

      # 12. Сохранение артефактов
      - name: Upload test results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            allure-results/
            test-results.xml
            allure-report/
          retention-days: 30