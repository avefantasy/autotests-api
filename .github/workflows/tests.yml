name: API tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Добавить ручной запуск

jobs:
  run-tests:
    runs-on: ubuntu-latest
    
    # Добавить таймаут для всего job
    timeout-minutes: 15
    
    steps:
      # 1. Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v4
        
      # 2. Установка Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # Кэширование pip для ускорения
          
      # 3. Клонирование тестового сервера
      - name: Clone test server repository
        run: |
          git clone https://github.com/Nikita-Filonov/qa-automation-engineer-api-course.git
          cd qa-automation-engineer-api-course
          # Фиксация версии (если нужно)
          # git checkout v1.0.0
          
      # 4. Установка зависимостей сервера
      - name: Install server dependencies
        run: |
          cd qa-automation-engineer-api-course
          pip install -r requirements.txt
          
      # 5. Запуск и проверка сервера
      - name: Start and verify test server
        env:
          APP_HOST: "http://localhost:8000"
          DATABASE_URL: "sqlite+aiosqlite:///./local.db"
          JWT_ALGORITHM: "HS256"
          JWT_SECRET_KEY: "qa-automation-engineer-api-course-secret-key"
          JWT_ACCESS_TOKEN_EXPIRE: 1800
          JWT_REFRESH_TOKEN_EXPIRE: 5184000
        run: |
          # Запуск сервера в фоне
          cd qa-automation-engineer-api-course
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          
          # Ждем, пока сервер станет доступен
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/docs > /dev/null; then
              echo "Server is up and running!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Server failed to start within 30 seconds"
              exit 1
            fi
            sleep 1
          done
          
          # Сохраняем PID для последующего завершения
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          
      # 6. Установка зависимостей проекта
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Установить allure-pytest если нужно
          pip install allure-pytest pytest-xdist
          
      # 7. Запуск тестов
      - name: Run API tests
        run: |
          pytest -m regression \
            --alluredir=allure-results \
            --numprocesses=2 \
            --junitxml=test-results.xml \
            --tb=short
          
      # 8. Завершение сервера
      - name: Stop test server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            echo "Stopping server with PID: $SERVER_PID"
            kill $SERVER_PID || true
          fi
          
      # 9. Генерация отчета Allure (современный способ)
      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@v1.12  # Или перейти на более свежую альтернативу
        with:
          allure_results: allure-results
          allure_report: allure-report
          keep_reports: 20
          
      # 10. Деплой на GitHub Pages
      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'  # Только для main ветки
        uses: peaceiris/actions-gh-pages@v3  # Использовать v3 вместо v4 (v4 изменила API)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          force_orphan: true  # Очищать ветку перед публикацией
          
      # 11. Артефакты для отладки
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            allure-results/
            test-results.xml
          retention-days: 7